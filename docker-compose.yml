services:
  mysql:
    image: mysql:8.0
    container_name: testhub_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .docker_env}
      MYSQL_DATABASE: ${DB_NAME:-testhub}
      MYSQL_USER: ${DB_USER:-testhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .docker_env}
    volumes:
      - testhub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [testhub]

  redis:
    image: redis:7-alpine
    container_name: testhub_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - testhub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [testhub]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${DOCKER_NAMESPACE:-testhub}/backend:${IMAGE_VERSION:-latest}
    container_name: testhub_backend
    restart: unless-stopped
    env_file:
      - .docker_env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-testhub}
      DB_USER: ${DB_USER:-testhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .docker_env}
      REDIS_URL: redis://redis:6379/0
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "backend.asgi:application"]
    ports:
      - "${BACKEND_PORT:-18181}:8000"
    volumes:
      - testhub_static_data:/app/static_files
      - testhub_media_data:/app/media
      - testhub_logs_data:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [testhub]

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${DOCKER_NAMESPACE:-testhub}/backend:${IMAGE_VERSION:-latest}
    container_name: testhub_scheduler
    restart: unless-stopped
    env_file:
      - .docker_env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-testhub}
      DB_USER: ${DB_USER:-testhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .docker_env}
      REDIS_URL: redis://redis:6379/0
      SCHEMA_SETUP_ENABLED: "False"
      RUN_COLLECTSTATIC: "False"
    command: ["/scheduler-loop.sh"]
    volumes:
      - testhub_media_data:/app/media
      - testhub_logs_data:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [testhub]

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: ${DOCKER_NAMESPACE:-testhub}/frontend:${IMAGE_VERSION:-latest}
    container_name: testhub_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18081}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - testhub_static_data:/srv/static:ro
      - testhub_media_data:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [testhub]

volumes:
  # Named volumes are internal to this Compose project; no host database is mounted.
  testhub_mysql_data:
  testhub_redis_data:
  testhub_static_data:
  testhub_media_data:
  testhub_logs_data:

networks:
  testhub:
    driver: bridge
